apiVersion: v1
kind: Pod
metadata:
  name: app
  namespace: elastic-stack
  labels:
    name: app
spec:
  containers:
  - name: app
    image: kodekloud/event-simulator
    volumeMounts:
    - mountPath: /log
      name: log-volume
  initContainers:
  - name: sidecar
    image: kodekloud/filebeat
    imagePullSecrets: private-reg-cred
    securityContext:
      runAsUser: 1010
      capabilities:
        add: ["SYS_TIME"]

  volumes:
  - name: log-volume
    hostPath:
      path: /var/log/webapp
      type: DirectoryOrCreate